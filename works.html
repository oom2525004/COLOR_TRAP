<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制作実績 | TOWER &amp; TAIL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>

  :root{
    --cream: #F7F3EC;
    --cream-deep: #EEE7D8;
    --ink: #1B1B18;
    --ink-soft: #4A453C;
    --brass: #A9824F;
    --brass-soft: #D9C39C;
    --line: rgba(27,27,24,0.14);

    --font-serif: 'Shippori Mincho', serif;
    --font-sans: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;

    --dot: rgba(27,27,24,0.07);
  }
  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0;
    background-color:var(--cream);
    background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
    background-size: 28px 28px;
    color:var(--ink);
    font-family:var(--font-sans);
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; }
  h1,h2,h3{
    font-family:var(--font-serif);
    font-weight:700;
    margin:0;
    letter-spacing:.02em;
  }
  .wrap{ max-width:1040px; margin:0 auto; padding:0 28px; }
  .narrow{ max-width:620px; margin:0 auto; padding:0 28px; }

  header.site{
    position:sticky;
    top:0;
    z-index:50;
    background:rgba(247,243,236,0.92);
    backdrop-filter:saturate(140%) blur(6px);
    border-bottom:1px solid var(--line);
  }
  .header-inner{
    max-width:1040px;
    margin:0 auto;
    padding:14px 28px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
  }
  .brand{ display:flex; align-items:center; gap:12px; text-decoration:none; }
  .brand img{ width:38px; height:38px; border-radius:50%; display:block; }
  .brand-word{ font-family:var(--font-serif); font-size:15px; letter-spacing:.14em; color:var(--ink); }
  nav.site-nav{ display:flex; gap:26px; font-size:14px; }
  nav.site-nav a{
    text-decoration:none; color:var(--ink-soft);
    border-bottom:1px solid transparent; padding-bottom:2px;
    transition:border-color .15s ease, color .15s ease;
  }
  nav.site-nav a:hover, nav.site-nav a:focus-visible{ color:var(--ink); border-bottom-color:var(--brass); }

  .primary-btn{
    display:inline-block;
    font-family:var(--font-sans);
    font-weight:700;
    font-size:14.5px;
    color:var(--cream);
    background:var(--ink);
    border:none;
    border-radius:999px;
    padding:14px 32px;
    text-decoration:none;
    transition:background .15s ease, transform .1s ease;
  }
  .primary-btn:hover{ background:#000; }
  .primary-btn:active{ transform:scale(.98); }

  .ghost-btn{
    display:inline-block;
    font-family:var(--font-sans);
    font-size:13.5px;
    color:var(--ink-soft);
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    padding:9px 22px;
    text-decoration:none;
    transition:border-color .15s ease, color .15s ease;
  }
  .ghost-btn:hover{ border-color:var(--brass); color:var(--ink); }

  footer.site{
    padding:56px 0 40px;
    text-align:center;
    border-top:1px solid var(--line);
    margin-top:60px;
  }
  footer.site img{ width:48px; height:48px; border-radius:50%; margin:0 auto 14px; display:block; }
  footer.site .foot-word{ font-family:var(--font-serif); font-size:14px; letter-spacing:.16em; }
  footer.site .foot-links{ margin-top:18px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  footer.site .foot-copy{ margin-top:22px; font-size:12px; color:var(--ink-soft); opacity:.75; }

  .page-head{
    padding:64px 0 20px;
    text-align:center;
  }
  .page-head h1{ font-size:clamp(28px, 5vw, 38px); }
  .page-head .lede{
    margin-top:12px;
    font-size:14.5px;
    color:var(--ink-soft);
  }

  .works-list{
    padding: 30px 0 70px;
  }
  .work-card{
    display:flex;
    gap:28px;
    align-items:center;
    background:rgba(255,255,255,0.4);
    border:1px solid var(--line);
    border-radius:22px;
    padding:22px;
    text-decoration:none;
    color:inherit;
    transition:border-color .15s ease, transform .15s ease;
  }
  .work-card:hover{
    border-color:var(--brass);
    transform:translateY(-2px);
  }
  .work-thumb{
    width:96px;
    flex-shrink:0;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 14px 30px -14px rgba(27,27,24,0.35);
  }
  .work-thumb img{ display:block; width:100%; height:auto; }
  .work-body h2{
    font-size:20px;
  }
  .work-body p{
    margin:8px 0 0;
    font-size:14px;
    color:var(--ink-soft);
  }
  .work-tag{
    display:inline-block;
    margin-top:10px;
    font-family:var(--font-sans);
    font-size:12px;
    color:var(--brass);
    border:1px solid var(--brass-soft);
    border-radius:999px;
    padding:3px 12px;
  }
  @media (max-width:520px){
    .work-card{ flex-direction:column; text-align:center; }
  }
</style>
</head>
